name: Windows Development Build

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build-windows.txt
      - run: python -m pytest -q
      - shell: pwsh
        run: |
          $version = python -c "from runlab.version import __version__; print(__version__)"
          "NHRA_VELOCITY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: cmd
        run: build_windows_exe.bat
      - name: Smoke frozen desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:NHRA_TECH_DEV_UNAUTHENTICATED = "1"
          $env:NHRA_VELOCITY_HOME = Join-Path $env:RUNNER_TEMP "velocity-smoke-frozen"
          $exe = Resolve-Path "dist\NHRA-Velocity\NHRA-Velocity.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Frozen desktop smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Frozen desktop smoke test failed with exit code $($p.ExitCode)" }
      - shell: pwsh
        run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NHRA-Velocity.iss'
      - name: Smoke installed desktop
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\NHRA-Velocity-Setup-*.exe | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=""' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:NHRA_TECH_DEV_UNAUTHENTICATED = "1"
          $env:NHRA_VELOCITY_HOME = Join-Path $env:RUNNER_TEMP "velocity-smoke-installed"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\NHRA Velocity\NHRA-Velocity.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Installed desktop smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Installed desktop smoke test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NHRA-Velocity-${{ env.NHRA_VELOCITY_VERSION }}-${{ github.sha }}
          path: |
            installer/Output/*.exe
            PRODUCT_MANIFEST.json
            VALIDATION_REPORT.md
          if-no-files-found: error
          retention-days: 30
