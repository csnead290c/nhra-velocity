name: Windows Development Build

on:
  workflow_dispatch:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build-windows.txt
      - run: python -m pytest -q
      - shell: pwsh
        run: |
          $version = python -c "from runlab.version import __version__; print(__version__)"
          "NHRA_TECH_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: cmd
        run: build_windows_exe.bat
      - shell: pwsh
        run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NHRA-Tech-Data.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: NHRA-Tech-Data-${{ env.NHRA_TECH_VERSION }}-${{ github.sha }}
          path: |
            installer/Output/*.exe
            PRODUCT_MANIFEST.json
            VALIDATION_REPORT.md
          if-no-files-found: error
          retention-days: 30
