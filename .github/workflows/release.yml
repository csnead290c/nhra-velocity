name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build-windows.txt
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: python -m runlab.cli selftest
      - run: python -m runlab.cli release audit --root .
      - shell: pwsh
        run: |
          $version = python -c "from runlab.version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag/version mismatch: ${{ github.ref_name }} vs v$version" }
          "NHRA_VELOCITY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - shell: cmd
        run: build_windows_exe.bat
      - name: Smoke frozen desktop
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:NHRA_TECH_DEV_UNAUTHENTICATED = "1"
          $env:NHRA_VELOCITY_HOME = Join-Path $env:RUNNER_TEMP "velocity-release-smoke-frozen"
          $exe = Resolve-Path "dist\NHRA-Velocity\NHRA-Velocity.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Frozen release smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Frozen release smoke test failed with exit code $($p.ExitCode)" }
      - shell: pwsh
        run: choco install innosetup --no-progress -y
      - shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\NHRA-Velocity.iss'
      - name: Smoke installed release
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\NHRA-Velocity-Setup-*.exe | Select-Object -First 1
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=""' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:NHRA_TECH_DEV_UNAUTHENTICATED = "1"
          $env:NHRA_VELOCITY_HOME = Join-Path $env:RUNNER_TEMP "velocity-release-smoke-installed"
          $exe = Join-Path $env:LOCALAPPDATA "Programs\NHRA Velocity\NHRA-Velocity.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Installed release smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Installed release smoke test failed with exit code $($p.ExitCode)" }
      - shell: pwsh
        run: |
          $setup = Get-ChildItem installer\Output\NHRA-Velocity-Setup-*.exe | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($setup.Name)"
          python tools/build_update_manifest.py $setup.FullName --version $env:NHRA_VELOCITY_VERSION --channel stable --installer-url $url --source-commit "${{ github.sha }}" --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" --output update.json
          (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower() + "  " + $setup.Name | Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/Output/NHRA-Velocity-Setup-*.exe
            update.json
            SHA256SUMS.txt
            PRODUCT_MANIFEST.json
            VALIDATION_REPORT.md
